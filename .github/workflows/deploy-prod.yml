name: Deploy Production

on:
  workflow_run:
    workflows:
      - Build Backend to ECR
      - Build Frontend to ECR
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write
      contents: read
    runs-on:
      - self-hosted
      - linux
      - ARM64
    env:
      AWS_REGION: ap-northeast-1

    steps:
      - name: Ensure both build workflows are completed for the same SHA
        if: ${{ github.event_name == 'workflow_run' }}
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const targetNames = ["Build Backend to ECR", "Build Frontend to ECR"];

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: "push",
              branch: "main",
              per_page: 100
            });

            const runsByName = Object.fromEntries(
              targetNames.map((name) => [name, data.workflow_runs.find((run) => run.name === name && run.head_sha === headSha)])
            );

            const pending = targetNames.filter((name) => {
              const run = runsByName[name];
              return !run || run.status !== "completed" || run.conclusion !== "success";
            });

            if (pending.length > 0) {
              core.info(`Skip deploy for now. Pending/unsuccessful workflows for ${headSha}: ${pending.join(", ")}`);
              core.setOutput("should_deploy", "false");
              return;
            }

            core.info(`Both build workflows are completed for ${headSha}`);
            core.setOutput("should_deploy", "true");

      - name: Validate deploy prerequisites
        if: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.should_deploy == 'true' }}
        run: |
          set -euo pipefail
          test -d /opt/rowing-api
          test -f /etc/rowing-api/.env.prod

      - name: Configure AWS credentials
        if: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.should_deploy == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.should_deploy == 'true' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy on EC2 (self-hosted runner)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.should_deploy == 'true' }}
        working-directory: /opt/rowing-api
        env:
          DEPLOY_IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'latest' }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if IMAGE_TAG="${DEPLOY_IMAGE_TAG}" docker compose -f docker-compose.prod.yml --env-file /etc/rowing-api/.env.prod pull backend frontend; then
              break
            fi
            if [ "${i}" -eq 90 ]; then
              echo "Timed out waiting for backend/frontend images tagged ${DEPLOY_IMAGE_TAG}" >&2
              exit 1
            fi
            sleep 15
          done
          IMAGE_TAG="${DEPLOY_IMAGE_TAG}" ENV_FILE=/etc/rowing-api/.env.prod bash deploy/scripts/deploy_prod.sh
          docker compose -f docker-compose.prod.yml --env-file /etc/rowing-api/.env.prod ps

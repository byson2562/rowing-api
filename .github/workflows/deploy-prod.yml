name: Deploy Production

on:
  workflow_run:
    workflows:
      - Build and Push to ECR
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on:
      - self-hosted
      - linux
      - ARM64

    steps:
      - name: Validate deploy prerequisites
        run: |
          set -euo pipefail
          test -d /opt/rowing-api
          test -f /etc/rowing-api/.env.prod

      - name: Deploy on EC2 (self-hosted runner)
        working-directory: /opt/rowing-api
        run: |
          set -euo pipefail
          ENV_FILE=/etc/rowing-api/.env.prod bash deploy/scripts/deploy_prod.sh
          docker compose -f docker-compose.prod.yml --env-file /etc/rowing-api/.env.prod ps

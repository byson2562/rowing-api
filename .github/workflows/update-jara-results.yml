name: Update JARA Results

on:
  schedule:
    # 毎時実行するが、大会期間(.github/race-windows.json)の外では
    # 12:00 UTC(21:00 JST)の回以外はすぐ終了する
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "JARA competition year (defaults to the current year in JST)"
        required: false
        type: string
      allow_deletions:
        description: "Allow official results missing from the new snapshot to be removed"
        required: false
        default: false
        type: boolean

concurrency:
  group: update-jara-results
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether to run
        id: gate
        run: |
          set -euo pipefail
          now_date="$(TZ=Asia/Tokyo date +%F)"
          now_hour="$(date -u +%H)"
          in_window="$(python3 .github/scripts/in_race_window.py "${now_date}")"
          # 手動実行は常に走らせる。大会期間中は毎時、期間外は12:00 UTC(21:00 JST)の回だけ。
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            run="true"
          elif [[ "${in_window}" == "true" ]]; then
            run="true"
          elif [[ "${now_hour}" == "12" ]]; then
            run="true"
          else
            run="false"
          fi
          echo "in_window=${in_window}" >> "${GITHUB_OUTPUT}"
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "JST ${now_date} / 大会期間中: ${in_window} / 実行: ${run}"

      - name: Determine competition year
        if: steps.gate.outputs.run == 'true'
        id: year
        env:
          REQUESTED_YEAR: ${{ inputs.year }}
        run: |
          set -euo pipefail
          year="${REQUESTED_YEAR:-$(TZ=Asia/Tokyo date +%Y)}"
          if [[ ! "${year}" =~ ^[0-9]{4}$ ]]; then
            echo "year must be a four-digit number: ${year}" >&2
            exit 1
          fi
          echo "value=${year}" >> "${GITHUB_OUTPUT}"

      - name: Build updater container
        if: steps.gate.outputs.run == 'true'
        run: docker build --tag rowing-api-jara-updater scripts/jara

      - name: Test updater
        if: steps.gate.outputs.run == 'true'
        run: |
          docker run --rm \
            --entrypoint bundle \
            rowing-api-jara-updater \
            exec ruby /app/test/update_results_test.rb

      - name: Collect current JARA results
        if: steps.gate.outputs.run == 'true'
        env:
          YEAR: ${{ steps.year.outputs.value }}
          ALLOW_DELETIONS: ${{ inputs.allow_deletions || false }}
        run: |
          set -euo pipefail
          args=(--year "${YEAR}")
          if [[ "${ALLOW_DELETIONS}" == "true" ]]; then
            args+=(--allow-decrease)
          fi
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            rowing-api-jara-updater \
            "${args[@]}"

      - name: Validate complete dataset
        if: steps.gate.outputs.run == 'true'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --entrypoint bundle \
            rowing-api-jara-updater \
            exec ruby /app/validate_results.rb

      # コンテナは root で動くため、生成物の所有者が runner と異なる。
      # 以降のステップ(読み取り・git add)が確実に通るよう揃えておく
      - name: Normalize generated file ownership
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" frontend/data/results frontend/lib/results-data.ts

      - name: Detect generated changes
        id: changes
        if: steps.gate.outputs.run == 'true'
        env:
          YEAR: ${{ steps.year.outputs.value }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- \
            "frontend/data/results/${YEAR}.json" \
            frontend/data/results/index.json \
            frontend/lib/results-data.ts)" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify frontend
        if: steps.gate.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          docker compose run --rm frontend sh -lc "npm run lint && npm run build"

      # 大会期間中は人手を介さず main へ直接コミットする。決勝の結果が数時間以内に
      # 公開されないと、検索需要のピーク(大会当日〜翌日)を逃すため。
      # 期間外は従来どおりPRを作り、内容を見てからマージする。
      - name: Check record count change
        id: delta
        if: steps.gate.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        env:
          YEAR: ${{ steps.year.outputs.value }}
        run: |
          set -uo pipefail
          before="$(git show HEAD:"frontend/data/results/${YEAR}.json" 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo "")"
          after="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "frontend/data/results/${YEAR}.json" 2>/dev/null || echo "")"
          echo "before=${before:-?} after=${after:-?}"
          echo "before=${before:-?}" >> "${GITHUB_OUTPUT}"
          echo "after=${after:-?}" >> "${GITHUB_OUTPUT}"
          # 件数を数えられなかった場合は自動コミットせずPRに回す。
          # 取り込み自体は成功しているので、ここでジョブを落とさない。
          if [[ -z "${before}" || -z "${after}" ]]; then
            echo "decreased=true" >> "${GITHUB_OUTPUT}"
            echo "::warning::レコード件数を数えられませんでした。自動コミットせずPRにします。"
          # 件数が減る変更は自動で入れない(公式ページの一時的な不整合やパース失敗を想定)
          elif (( after < before )); then
            echo "decreased=true" >> "${GITHUB_OUTPUT}"
            echo "::warning::レコードが ${before} から ${after} に減少。自動コミットせずPRにします。"
          else
            echo "decreased=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit to main during a race window
        if: |
          steps.gate.outputs.run == 'true' &&
          steps.changes.outputs.changed == 'true' &&
          steps.gate.outputs.in_window == 'true' &&
          steps.delta.outputs.decreased == 'false'
        env:
          YEAR: ${{ steps.year.outputs.value }}
          BEFORE: ${{ steps.delta.outputs.before }}
          AFTER: ${{ steps.delta.outputs.after }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "frontend/data/results/${YEAR}.json" \
            frontend/data/results/index.json \
            frontend/lib/results-data.ts
          git commit -m "chore: update ${YEAR} JARA results (${BEFORE} -> ${AFTER})"
          # 他のpushと競合したら取り込んでから送る
          git pull --rebase origin main
          git push origin HEAD:main
          echo "main へ直接コミットしました。deploy-cloudflare が本番へ反映します。"

      - name: Create or update results pull request
        if: |
          steps.gate.outputs.run == 'true' &&
          steps.changes.outputs.changed == 'true' &&
          (steps.gate.outputs.in_window != 'true' || steps.delta.outputs.decreased == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ steps.year.outputs.value }}
        run: |
          set -euo pipefail
          branch="automation/jara-results-${YEAR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${branch}"
          git add \
            "frontend/data/results/${YEAR}.json" \
            frontend/data/results/index.json \
            frontend/lib/results-data.ts
          git commit -m "chore: update ${YEAR} JARA results"
          git push --force origin "HEAD:refs/heads/${branch}"

          body="JARA公式大会ページから${YEAR}年度の公開済み決勝結果を自動収集しました。データ検証、lint、本番buildはワークフロー内で完了しています。"
          pr_number="$(gh pr list \
            --base main \
            --head "${branch}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "${pr_number}" ]]; then
            gh pr edit "${pr_number}" --title "chore: update ${YEAR} JARA results" --body "${body}"
            exit 0
          fi
          # ブランチのpushは済んでいるので、PRを作れなくても収集結果は失われない。
          # Settings > Actions > General の "Allow GitHub Actions to create and
          # approve pull requests" が無効だとここで失敗するため、ジョブは落とさず案内する。
          if ! gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore: update ${YEAR} JARA results" \
            --body "${body}"; then
            echo "::warning::PRを作成できませんでした。ブランチ ${branch} は push 済みです: ${{ github.server_url }}/${{ github.repository }}/compare/main...${branch}?expand=1"
          fi

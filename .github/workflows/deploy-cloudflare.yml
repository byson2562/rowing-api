name: Deploy to Cloudflare

# Vercel は GitHub 連携で main を自動デプロイしていたが、Cloudflare Workers への移行に
# ともないその仕組みがなくなった。JARA の自動更新PRをマージしても本番へ反映されなく
# なるため、ここでデプロイを担う。
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

# デプロイ同士が競合しないよう直列化する(古いpushは打ち切ってよい)
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # wrangler は Node 22 以上を要求する
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # NEXT_PUBLIC_* は frontend/.env.production から読まれる(公開値のみ)
      - name: Build and deploy
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production
        run: |
          set -euo pipefail
          ua="Mozilla/5.0 (compatible; deploy-check)"
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -A "$ua" --max-time 30 https://regattanavi.jp/)"
            server="$(curl -s -o /dev/null -D - -A "$ua" --max-time 30 https://regattanavi.jp/ | tr -d '\r' | grep -i '^server:' || true)"
            echo "attempt ${i}: ${code} ${server}"
            if [[ "${code}" == "200" ]] && echo "${server}" | grep -qi cloudflare; then
              echo "deployment verified"
              exit 0
            fi
            sleep 15
          done
          echo "production did not respond as expected" >&2
          exit 1

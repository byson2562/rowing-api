services:
  frontend:
    build:
      context: ./frontend
    container_name: smart_rowing_frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:5173}
      NEXT_PUBLIC_DONATION_URL: ${NEXT_PUBLIC_DONATION_URL:-mailto:takumi.nakamura.by@gmail.com?subject=RowingAPI%20%E5%AF%84%E4%BB%98%E3%81%AB%E3%81%A4%E3%81%84%E3%81%A6}
      NEXT_PUBLIC_STRIPE_DONATE_URL: ${NEXT_PUBLIC_STRIPE_DONATE_URL:-}
      NEXT_PUBLIC_STRIPE_DONATE_URL_500: ${NEXT_PUBLIC_STRIPE_DONATE_URL_500:-}
      NEXT_PUBLIC_STRIPE_DONATE_URL_1000: ${NEXT_PUBLIC_STRIPE_DONATE_URL_1000:-}
      NEXT_PUBLIC_STRIPE_DONATE_URL_3000: ${NEXT_PUBLIC_STRIPE_DONATE_URL_3000:-}
      NEXT_PUBLIC_STRIPE_DONATE_URL_CUSTOM: ${NEXT_PUBLIC_STRIPE_DONATE_URL_CUSTOM:-}
      VERCEL_URL: ${VERCEL_URL:-localhost:5173}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && rm -rf /app/.next /app/.next-dev && npm run dev"
    ports:
      - "5173:5173"

  frontend-e2e:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    container_name: smart_rowing_frontend_e2e
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:5173}
      CI: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -lc "npm ci && npm run e2e"
